name: Build and Publish Release Binaries

# Builds the vscode-reh-web server binary (this fork's primary target - a
# lightweight, extension-host-compatible VS Code that serves the workbench UI
# to a browser instead of bundling Electron/Chromium) for Linux, macOS, and
# Windows, on both x64 and arm64 where GitHub provides a native runner, and
# attaches each as a downloadable asset on a GitHub Release.
#
# Triggers on pushing a version tag (`v*`) - this is a ref-based event, so it
# fires regardless of which branch the tagged commit lives on. It does NOT
# require this workflow file to be on the repository's default branch, which
# matters here: `main` is kept as a clean mirror for pulling in upstream
# fixes, and all fork-specific work (including this workflow) lives on the
# dev branch instead. If no release exists yet for the pushed tag, one is
# created automatically before assets are uploaded to it.
#
# `release: published` and manual `workflow_dispatch` are also wired up as
# convenience triggers, but note GitHub only auto-fires `release` events for
# workflow files that exist on the default branch - on a non-default branch,
# use workflow_dispatch (Actions tab -> this workflow -> Run workflow, with
# the branch selector) or just push a tag, which works from any branch.
#
# Runs on GitHub-hosted runners, which have normal internet access - unlike the
# sandboxed environment this workflow was originally authored in, so none of
# the .npmrc/kerberos/GITHUB_TOKEN workarounds documented in this repo's commit
# history should be necessary here.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach binaries to (defaults to the latest release if omitted)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure a release exists for this tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "No release found for $TAG yet - creating one."
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --generate-notes
          else
            echo "Release $TAG already exists."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gulp_task: vscode-reh-web-linux-x64
            output_name: vscode-reh-web-linux-x64
            node_bin: node
          - os: ubuntu-24.04-arm
            gulp_task: vscode-reh-web-linux-arm64
            output_name: vscode-reh-web-linux-arm64
            node_bin: node
          - os: macos-15-intel
            gulp_task: vscode-reh-web-darwin-x64
            output_name: vscode-reh-web-darwin-x64
            node_bin: node
          - os: macos-15
            gulp_task: vscode-reh-web-darwin-arm64
            output_name: vscode-reh-web-darwin-arm64
            node_bin: node
          - os: windows-latest
            gulp_task: vscode-reh-web-win32-x64
            output_name: vscode-reh-web-win32-x64
            node_bin: node.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout at target tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Pin Xcode version (avoid std::optional build failures on newer SDKs)
        if: runner.os == 'macOS'
        run: |
          # Several native addons this repo depends on (@parcel/watcher,
          # @vscode/policy-watcher, ...) use std::optional without an
          # explicit #include <optional>. Xcode 26's libc++ headers no
          # longer transitively pull that in the way older SDKs did, so
          # from-source builds of those addons fail on the current
          # macos-latest image. Pin to a known-good Xcode 16.x, confirmed
          # present at this exact path on both macos-15 and macos-15-intel.
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Read Node version from .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}

      - name: Install native module build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libxkbfile-dev libx11-dev

      - name: Locate Visual Studio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # build/npm/preinstall.ts does its own VS detection ahead of
          # node-gyp's own, and only trusts a `vsNNNN_install` env var or a
          # fixed set of default Program Files paths - neither reliably
          # matches what's actually on the runner image (edition/version
          # naming drifts over time). vswhere.exe is the tool Visual Studio
          # itself ships specifically to answer "where is VS actually
          # installed" and is guaranteed present on GitHub's Windows
          # runners, so use it instead of guessing a path.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "vswhere could not find a Visual Studio install with the C++ (VC.Tools.x86.x64) component"
          }
          Write-Host "Found Visual Studio at: $vsPath"
          "vs2022_install=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Type-check
        run: npm run typecheck-client

      - name: Build ${{ matrix.gulp_task }}
        run: npm run gulp ${{ matrix.gulp_task }}

      - name: Smoke-test the built server
        run: |
          OUT_DIR="$(dirname "$PWD")/${{ matrix.output_name }}"
          "$OUT_DIR/${{ matrix.node_bin }}" "$OUT_DIR/out/server-main.js" \
            --host 127.0.0.1 --port 9999 \
            --without-connection-token --accept-server-license-terms &
          SERVER_PID=$!
          sleep 8
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9999/ --max-time 10)
          kill "$SERVER_PID" 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: server returned HTTP $STATUS"
            exit 1
          fi
          echo "Smoke test passed: HTTP $STATUS"

      - name: Package binary
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE="vscode-utcs-${{ matrix.output_name }}-${VERSION}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$PWD")" "${{ matrix.output_name }}"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload binary to the release
        run: gh release upload "${{ needs.resolve-tag.outputs.tag }}" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.archive }}.sha256" --clobber --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
