name: Build and Publish Release Binaries

# Builds the VSCode-UTCS *desktop* (Electron) app and publishes real
# installers as GitHub Release assets:
#
#   Windows  -> .exe   (Inno Setup user-installer)
#   macOS    -> .dmg   (from the built .app bundle)
#   Linux    -> .AppImage
#
# Triggers on pushing a version tag (`v*`). That is a ref-based event, so it
# fires regardless of which branch the tagged commit lives on and does NOT
# require this file to be on the default branch - `main` here is kept as a
# clean mirror for pulling upstream fixes, while fork work lives on the dev
# branch. If no release exists for the tag yet, one is created first.
#
# Note on packaging coverage: upstream VS Code only ships gulp tasks for
# .exe (Inno Setup) and Linux deb/rpm/snap. It has no AppImage or dmg task,
# so those two are assembled here from the plain build output.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach installers to (defaults to the latest release)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure a release exists for this tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            gulp_task: vscode-win32-x64
            build_dir: VSCode-win32-x64
            kind: exe
          - os: macos-15
            gulp_task: vscode-darwin-arm64
            build_dir: VSCode-darwin-arm64
            kind: dmg
          - os: macos-15-intel
            gulp_task: vscode-darwin-x64
            build_dir: VSCode-darwin-x64
            kind: dmg
          - os: ubuntu-latest
            gulp_task: vscode-linux-x64
            build_dir: VSCode-linux-x64
            kind: appimage
            appimage_arch: x86_64
          - os: ubuntu-24.04-arm
            gulp_task: vscode-linux-arm64
            build_dir: VSCode-linux-arm64
            kind: appimage
            appimage_arch: aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout at target tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Pin Xcode version
        if: runner.os == 'macOS'
        run: |
          # Deterministic toolchain rather than the image's rotating default.
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Read Node version from .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}

      - name: Install native module build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libxkbfile-dev libx11-dev libsecret-1-dev fakeroot

      - name: Locate Visual Studio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # build/npm/preinstall.ts does its own VS detection ahead of
          # node-gyp's and only trusts a vsNNNN_install env var or a fixed set
          # of default paths. vswhere.exe is what Visual Studio ships to answer
          # "where is VS actually installed" and is present on GitHub runners.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "vswhere could not find a Visual Studio install with the C++ tools" }
          Write-Host "Found Visual Studio at: $vsPath"
          "vs2022_install=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Type-check
        run: npm run typecheck-client

      - name: Build ${{ matrix.gulp_task }}
        run: npm run gulp ${{ matrix.gulp_task }}

      # ---------------------------------------------------------------- Windows
      - name: Build Windows installer (.exe)
        if: matrix.kind == 'exe'
        id: exe
        run: |
          set -euo pipefail
          # code.iss packages `tools\*` without a skip-if-missing flag, but the
          # plain `vscode-win32-x64` build never creates that folder - the
          # separate inno-updater task stages inno_updater.exe/vcruntime140.dll
          # into it. Upstream CI runs the two back to back for this reason.
          npm run gulp vscode-win32-x64-inno-updater
          ls -l "$(dirname "$PWD")/${{ matrix.build_dir }}/tools"
          # The setup task does not chain the build; it reads the already-built
          # ../VSCode-win32-x64 and emits into .build/win32-x64/user-setup.
          npm run gulp vscode-win32-x64-user-setup
          VERSION="$(node -p "require('./package.json').version")"
          SRC="$(find .build/win32-x64/user-setup -name '*.exe' -print -quit)"
          if [ -z "$SRC" ]; then echo "No installer produced"; ls -R .build/win32-x64 || true; exit 1; fi
          ARTIFACT="VSCode-UTCS-${VERSION}-win32-x64-user-setup.exe"
          mv "$SRC" "$ARTIFACT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ macOS
      - name: Build macOS disk image (.dmg)
        if: matrix.kind == 'dmg'
        id: dmg
        run: |
          set -euo pipefail
          # Upstream has no dmg task, so build one from the .app with hdiutil
          # (part of macOS - no extra tooling required).
          APP="$(find "$(dirname "$PWD")/${{ matrix.build_dir }}" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then echo "No .app bundle found"; ls -la "$(dirname "$PWD")/${{ matrix.build_dir }}" || true; exit 1; fi
          echo "Found app bundle: $APP"
          VERSION="$(node -p "require('./package.json').version")"
          ARCH="$([ "${{ matrix.gulp_task }}" = "vscode-darwin-arm64" ] && echo arm64 || echo x64)"
          ARTIFACT="VSCode-UTCS-${VERSION}-darwin-${ARCH}.dmg"

          STAGE="$(mktemp -d)/VSCode-UTCS"
          mkdir -p "$STAGE"
          # ditto rather than `cp -R`: it is the copy that preserves bundle
          # symlinks, xattrs and ACLs faithfully, and it is what the signature
          # is computed over below.
          ditto "$APP" "$STAGE/$(basename "$APP")"
          STAGED_APP="$STAGE/$(basename "$APP")"
          ln -s /Applications "$STAGE/Applications"

          echo "--- signature as produced by the build ---"
          codesign -dv "$STAGED_APP" 2>&1 || true

          # @vscode/gulp-electron rewrites Contents/Info.plist, renames the main
          # executable, and renames all four Helper .app bundles along with
          # their executables and plists - but it never touches _CodeSignature.
          # That leaves Electron's own ad-hoc signature sealing contents that no
          # longer match it. A broken seal is worse than no seal: on Apple
          # Silicon macOS rejects the bundle outright with "is damaged and can't
          # be opened", which is not click-throughable.
          #
          # Re-sign ad-hoc, innermost first. `--deep` is deprecated by Apple and
          # skips Mach-O outside the standard bundle locations (the .node addons
          # under Resources), so walk it explicitly. No hardened runtime: that
          # would need entitlements for Electron's JIT and would break launch.
          sign() { codesign --force --sign - --timestamp=none "$@"; }

          # 1. Loose Mach-O: dylibs, .node addons, the crashpad handler, and
          #    bundled CLI binaries under Resources such as ripgrep.
          #    Candidates are narrowed by mode/extension (walking `file` over
          #    every entry in the bundle is far too slow), then confirmed by
          #    content so shell scripts are left alone.
          #
          #    A bundle's own main binary is deliberately excluded here and
          #    left to the pass that signs its bundle. codesign resolves a
          #    main executable to the bundle that contains it, so signing
          #    Contents/MacOS/<app> directly is really an attempt to sign the
          #    whole app - which fails while its nested frameworks are still
          #    unsigned. The x64 build shows this and the arm64 one does not,
          #    because Electron ad-hoc signs arm64 (Apple Silicon requires it)
          #    and leaves x64 unsigned, so on arm64 there was always an
          #    existing nested signature to satisfy the check.
          is_bundle_main_binary() {
              local d; d="$(dirname "$1")"
              case "$d" in
                  */Contents/MacOS) return 0 ;;                    # .app main executable
                  *.framework/Versions/*)
                      # Only the binary sitting directly in the version
                      # directory; anything deeper (Versions/A/Libraries/*)
                      # is loose code and does need signing here.
                      case "${d##*.framework/Versions/}" in
                          */*) return 1 ;;
                          *) return 0 ;;
                      esac ;;
              esac
              return 1
          }
          find "$STAGED_APP" -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' -o -name '*.node' \) -print0 |
            while IFS= read -r -d '' f; do
              is_bundle_main_binary "$f" && continue
              case "$(file -b "$f")" in *Mach-O*) sign "$f" ;; esac
            done

          # 2. Versioned frameworks, signed at the version directory.
          find "$STAGED_APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' -print0 |
            while IFS= read -r -d '' f; do sign "$f/Versions/A"; done

          # 3. Helper apps, then 4. the outer bundle last.
          find "$STAGED_APP/Contents/Frameworks" -maxdepth 1 -name '*.app' -print0 |
            while IFS= read -r -d '' f; do sign "$f"; done
          sign "$STAGED_APP"

          # Fail the job rather than ship another unopenable dmg.
          echo "--- verifying re-signed bundle ---"
          codesign --verify --deep --strict --verbose=2 "$STAGED_APP"
          codesign -dv "$STAGED_APP" 2>&1 || true

          hdiutil create -volname "VSCode-UTCS" -srcfolder "$STAGE" -ov -format UDZO "$ARTIFACT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ Linux
      - name: Build Linux AppImage
        if: matrix.kind == 'appimage'
        id: appimage
        run: |
          # Upstream ships deb/rpm/snap but no AppImage, so assemble an AppDir
          # from the plain build output and package it with appimagetool.
          set -euo pipefail
          BUILD="$(dirname "$PWD")/${{ matrix.build_dir }}"
          APPNAME="$(node -p "require('./product.json').applicationName")"
          NAMELONG="$(node -p "require('./product.json').nameLong")"
          NAMESHORT="$(node -p "require('./product.json').nameShort")"
          VERSION="$(node -p "require('./package.json').version")"

          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR"
          cp -a "$BUILD"/. "$APPDIR"/

          # Desktop entry - resources/linux/code.desktop is a template.
          sed -e "s|@@NAME_LONG@@|${NAMELONG}|g" \
              -e "s|@@NAME_SHORT@@|${NAMESHORT}|g" \
              -e "s|@@NAME@@|${APPNAME}|g" \
              -e "s|@@EXEC@@|${APPNAME}|g" \
              -e "s|@@ICON@@|${APPNAME}|g" \
              resources/linux/code.desktop > "$APPDIR/${APPNAME}.desktop"
          cp resources/linux/code.png "$APPDIR/${APPNAME}.png"

          # Electron's SUID sandbox helper cannot be used from inside an
          # AppImage (the extracted mount is not setuid), so disable it.
          cat > "$APPDIR/AppRun" <<APPRUN
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/${APPNAME}" --no-sandbox "\$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          TOOL_ARCH="${{ matrix.appimage_arch }}"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOL_ARCH}.AppImage"
          chmod +x appimagetool

          ARTIFACT="VSCode-UTCS-${VERSION}-linux-${TOOL_ARCH}.AppImage"
          # --appimage-extract-and-run avoids needing FUSE on the runner.
          ARCH="$TOOL_ARCH" ./appimagetool --appimage-extract-and-run "$APPDIR" "$ARTIFACT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------- Upload
      - name: Checksum and upload to the release
        run: |
          ARTIFACT="${{ steps.exe.outputs.artifact }}${{ steps.dmg.outputs.artifact }}${{ steps.appimage.outputs.artifact }}"
          if [ -z "$ARTIFACT" ] || [ ! -f "$ARTIFACT" ]; then
            echo "Expected installer '$ARTIFACT' was not produced"; exit 1
          fi
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          ls -lh "$ARTIFACT"
          gh release upload "${{ needs.resolve-tag.outputs.tag }}" \
            "$ARTIFACT" "$ARTIFACT.sha256" --clobber --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after the build matrix has finished, so no job can race another's
  # freshly-uploaded asset. It deliberately does not require every build to
  # have succeeded - the step below refuses to prune unless the release
  # already carries at least one installer, which is the property that
  # actually matters (never leave the release empty).
  prune-legacy-assets:
    needs: [resolve-tag, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded reh-web (browser/server) assets
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          ASSETS="$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          INSTALLERS="$(echo "$ASSETS" | grep -Ei '\.(exe|dmg|AppImage)$' || true)"
          if [ -z "$INSTALLERS" ]; then
            echo "No installers on the release yet - refusing to prune."
            exit 0
          fi
          echo "Installers present:"; echo "$INSTALLERS"
          # This fork previously published vscode-reh-web server tarballs. The
          # desktop installers replace them, so drop any that linger on the
          # release. Scoped to the reh-web naming on purpose - it will never
          # touch an installer.
          STALE="$(echo "$ASSETS" | grep 'reh-web' || true)"
          if [ -z "$STALE" ]; then
            echo "No legacy reh-web assets to remove."
            exit 0
          fi
          echo "$STALE" | while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            echo "Deleting $asset"
            gh release delete-asset "$TAG" "$asset" --repo "${{ github.repository }}" --yes
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
